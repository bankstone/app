:root{--g:#287334;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#F4F6F1;overflow:hidden;font:16px "Segoe UI",Arial,sans-serif;color:#16231A;direction:rtl}
#bar{position:fixed;top:0;right:0;left:0;height:calc(48px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));background:var(--g);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:5}
#bar b{font-size:17px}
#bar button{border:1.5px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:999px;padding:5px 12px;font:700 14px Arial,sans-serif;cursor:pointer}
#app{position:fixed;top:calc(48px + env(safe-area-inset-top,0px));right:0;left:0;bottom:env(safe-area-inset-bottom,0px);width:100%;height:calc(100% - 48px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));border:0;background:#F4F6F1}
#key{position:fixed;inset:0;z-index:10;background:#fff;display:grid;place-items:center;overflow:auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
#key[hidden],#bar[hidden]{display:none}
.in{width:100%;max-width:380px;display:grid;gap:16px;justify-items:center;text-align:center}
.in img{width:min(40vw,150px);height:auto}
h1{margin:0;font-size:22px;color:var(--g)}
p{margin:0;line-height:1.55;color:#4A574D}
#k{width:100%;font:700 18px Consolas,monospace;text-align:center;direction:ltr;padding:12px;border:2px solid #CFDCCB;border-radius:14px;outline:none}
#k:focus{border-color:var(--g)}
#go{width:100%;border:0;border-radius:999px;padding:14px;font:800 18px Arial,sans-serif;background:var(--g);color:#fff;cursor:pointer}
#go:disabled{opacity:.6}
#m{min-height:22px;font-weight:700;color:#B4412F}
#load{position:fixed;inset:48px 0 0 0;display:grid;place-items:center;color:#5C6A5F;font-weight:600}
</style>

  <h1>דף השליטה של דיגמי</h1>
  <p>הקלד את סיסמת הניהול. מקלידים פעם אחת במכשיר הזה.</p>
  <input id="k" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="סיסמת ניהול" aria-label="סיסמת ניהול">
  <button id="go" type="button">כניסה</button>
  <div id="m" role="status"></div>
</div></div>
<script>
(function(){
  var url=String(window.DIGMI_URL||''),LSK='digmi-admin-key';
  function get(){try{return localStorage.getItem(LSK)||'';}catch(e){return '';}}
  function set(v){try{if(v)localStorage.setItem(LSK,v);else localStorage.removeItem(LSK);}catch(e){}}
  var $=function(i){return document.getElementById(i);},frame=null;
  function open(k){$('key').hidden=true;$('bar').hidden=false;$('load').hidden=false;
    if(frame)frame.remove();frame=document.createElement('iframe');frame.id='app';frame.title='דף השליטה';
    frame.addEventListener('load',function(){$('load').hidden=true;});
    frame.src=url+'?admin='+encodeURIComponent(k);document.body.appendChild(frame);}
  function ask(msg){if(frame){frame.remove();frame=null;}$('bar').hidden=true;$('load').hidden=true;$('key').hidden=false;$('m').textContent=msg||'';
    setTimeout(function(){try{$('k').focus();}catch(e){}},300);}
  function check(k,ok,bad){fetch(url+'?ak='+encodeURIComponent(k),{cache:'no-store'}).then(function(r){return r.json();})
    .then(function(j){if(j&&j.ok)ok();else bad('הסיסמה לא נכונה.');}).catch(function(){bad('אין חיבור. בדוק את האינטרנט ונסה שוב.');});}
  $('go').addEventListener('click',function(){var k=$('k').value.trim();if(!k){$('m').textContent='הקלד את הסיסמה.';return;}
    var b=this;b.disabled=true;b.textContent='בודק…';
    check(k,function(){set(k);b.disabled=false;b.textContent='כניסה';open(k);},function(t){b.disabled=false;b.textContent='כניסה';$('m').textContent=t;});});
  $('k').addEventListener('keydown',function(e){if(e.key==='Enter')$('go').click();});
  $('rl').addEventListener('click',function(){var k=get();if(k)open(k);});
  $('out').addEventListener('click',function(){set('');$('k').value='';ask('יצאת. בכניסה הבאה צריך להקליד את הסיסמה שוב.');});
  var k=get();
  if(k){open(k);check(k,function(){},function(t){if(/לא נכונה/.test(t)){set('');ask(t);}});}else ask('');
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&get()&&frame)open(get());});   /* חזרה לאפליקציה – נתונים עדכניים */
  if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(function(){});}
})();
</script>
